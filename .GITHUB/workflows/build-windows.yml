name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build KaraokeForge.exe (win-x64)
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build a single self-contained exe
        run: >
          dotnet publish KaraokeForge.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeForge-windows-x64
          path: publish/KaraokeForge.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach the exe to a tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: KaraokeForge-windows-x64
          path: publish

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/KaraokeForge.exe
          generate_release_notes: true
